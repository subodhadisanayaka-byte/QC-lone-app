<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#fcd34d"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#dropGlow)"/>

  <!-- Inner Subtle Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Back Coin (Angle) -->
  <circle cx="330" cy="200" r="105" fill="#d97706" opacity="0.9"/>
  <circle cx="330" cy="200" r="95" fill="url(#goldGrad)" opacity="0.95"/>
  <circle cx="330" cy="200" r="75" fill="none" stroke="#b45309" stroke-width="6" stroke-dasharray="8 6"/>

  <!-- Front Main Coin -->
  <g filter="url(#dropGlow)">
    <circle cx="210" cy="275" r="130" fill="#b45309"/>
    <circle cx="210" cy="275" r="120" fill="url(#goldGrad)"/>
    <circle cx="210" cy="275" r="95" fill="none" stroke="#d97706" stroke-width="8"/>
    
    <!-- QC Monogram Inside Coin -->
    <text x="210" y="302" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="-2">QC</text>
  </g>

  <!-- Sparkle 1 -->
  <path d="M 370 120 Q 370 150 400 150 Q 370 150 370 180 Q 370 150 340 150 Q 370 150 370 120 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Sparkle 2 -->
  <path d="M 120 180 Q 120 195 135 195 Q 120 195 120 210 Q 120 195 105 195 Q 120 195 120 180 Z" fill="#ffffff" opacity="0.8"/>
</svg>
